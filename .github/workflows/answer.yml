name: Answer hourly quiz

on:
  schedule:
    # GitHub may delay scheduled runs; polling every 5 minutes keeps us far inside the 3-hour window.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: answer
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Claude SDK (fallback for unrecognised questions)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: pip install --quiet anthropic

      - name: Answer new rounds
        run: python run.py

      - name: Commit and push
        run: |
          git config user.name "quiz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add answers meta
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git commit -m "Answers: $(git diff --cached --name-only answers | sed 's#answers/round-##; s#.json##' | tr '\n' ' ')"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
