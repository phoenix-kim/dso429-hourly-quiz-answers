name: Answer hourly quiz

on:
  schedule:
    # GitHub often delays or skips scheduled runs by hours, so each run stays alive
    # for ~5.5 hours and polls every 2 minutes. Only one run is active at a time; the
    # next scheduled run waits in the queue and takes over when the current one ends.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: answer
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Claude SDK (fallback for unrecognised questions)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: pip install --quiet anthropic

      - name: Poll for new rounds, answer and push
        run: |
          git config user.name "quiz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 330*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            git pull -q --rebase origin main || true
            python run.py || echo "run.py failed; retrying next poll"
            git add answers meta
            if ! git diff --cached --quiet; then
              git commit -q -m "Answers: $(git diff --cached --name-only answers | sed 's#answers/round-##; s#.json##' | tr '\n' ' ')"
              for i in 1 2 3 4 5; do
                git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && break
                sleep 10
              done
            fi
            sleep 120
          done
